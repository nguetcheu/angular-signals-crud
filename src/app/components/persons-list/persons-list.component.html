<div class="list-container">
  <mat-card class="list-card">
    <mat-card-header class="card-header">
      <mat-card-title>Liste des Personnes</mat-card-title>
      <button mat-raised-button color="primary" routerLink="/add">
        <mat-icon>person_add</mat-icon> Ajouter
      </button>
    </mat-card-header>

    <mat-card-content class="card-content">
      <!-- Vérification si la liste lue par le Signal contient des éléments -->
      @if (personService.persons().length > 0) {
        <div class="table-responsive">
          <table mat-table [dataSource]="personService.persons()" class="mat-elevation-z1">

            <!-- Colonne Nom -->
            <ng-container matColumnDef="name">
              <th mat-header-cell *matHeaderCellDef>Nom</th>
              <td mat-cell *matCellDef="let person">{{ person.name }}</td>
            </ng-container>

            <!-- Colonne Ville -->
            <ng-container matColumnDef="city">
              <th mat-header-cell *matHeaderCellDef>Ville</th>
              <td mat-cell *matCellDef="let person">{{ person.city }}</td>
            </ng-container>

            <!-- Colonne Téléphone -->
            <ng-container matColumnDef="phoneNumber">
              <th mat-header-cell *matHeaderCellDef>Téléphone</th>
              <td mat-cell *matCellDef="let person">{{ person.phoneNumber }}</td>
            </ng-container>

            <!-- Colonne Actions (Modifier / Supprimer) -->
            <ng-container matColumnDef="actions">
              <th mat-header-cell *matHeaderCellDef class="actions-header">Actions</th>
              <td mat-cell *matCellDef="let person" class="actions-cell">
                <button mat-icon-button color="primary" [routerLink]="['/edit', person.id]" title="Modifier">
                  <mat-icon>edit</mat-icon>
                </button>
                <button mat-icon-button color="warn" (click)="deletePerson(person.id!)" title="Supprimer">
                  <mat-icon>delete</mat-icon>
                </button>
              </td>
            </ng-container>

            <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
            <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
          </table>
        </div>
      } @else {
        <div class="empty-state">
          <mat-icon class="empty-icon">group_off</mat-icon>
          <p>Aucune personne enregistrée pour le moment.</p>
        </div>
      }
    </mat-card-content>
  </mat-card>
</div>
